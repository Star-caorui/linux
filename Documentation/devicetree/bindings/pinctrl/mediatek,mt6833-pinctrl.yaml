%YAML 1.2
---
$id: http://devicetree.org/schemas/pinctrl/mediatek,mt6833-pinctrl.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MediaTek MT6833 Pin Controller

maintainers:
  - Betterr <51264180+Star-caorui@users.noreply.github.com>

description:
  The MediaTek's MT6833 Pin controller is used to control SoC pins.

properties:
  compatible:
    const: mediatek,mt6833-pinctrl

  reg:
    items:
      - description: pin controller base
      - description: rb group IO
      - description: bm group IO
      - description: br group IO
      - description: lm group IO
      - description: bl group IO
      - description: rt group IO
      - description: External Interrupt (EINT) controller base

  reg-names:
    items:
      - const: base
      - const: rb
      - const: bm
      - const: br
      - const: lm
      - const: bl
      - const: rt
      - const: eint

  gpio-controller: true

  '#gpio-cells':
    description:
      Number of cells in GPIO specifier. Since the generic GPIO binding is used,
      the amount of cells must be specified as 2. See the below mentioned gpio
      binding representation for description of particular cells.
    const: 2

  gpio-ranges:
    maxItems: 1

  gpio-line-names: true

  interrupts:
    description: The interrupt outputs to sysirq
    maxItems: 1

  interrupt-controller: true

  '#interrupt-cells':
    const: 2

# PIN CONFIGURATION NODES
patternProperties:
  '-pins$':
    type: object
    additionalProperties: false

    patternProperties:
      '^pins':
        type: object
        allOf:
          - $ref: /schemas/pinctrl/pincfg-node.yaml
          - $ref: /schemas/pinctrl/pinmux-node.yaml
        description:
          A pinctrl node should contain at least one subnodes representing the
          pinctrl groups available on the machine. Each subnode will list the
          pins it needs, and how they should be configured, with regard to muxer
          configuration, pullups, drive strength, input enable/disable and input
          schmitt.

        properties:
          pinmux:
            description:
              Integer array, represents gpio pin number and mux setting.
              Supported pin number and mux are defined as macros in
              include/dt-bindings/pinctrl/mt6833-pinfunc.h for this SoC.

          drive-strength:
            enum: [2, 4, 6, 8, 10, 12, 14, 16]

          drive-strength-microamp:
            enum: [125, 250, 500, 1000]

          bias-pull-down: true

          bias-pull-up: true

          bias-disable: true

          output-high: true

          output-low: true

          input-enable: true

          input-disable: true

          input-schmitt-enable: true

          input-schmitt-disable: true

        required:
          - pinmux

        additionalProperties: false

required:
  - compatible
  - reg
  - interrupts
  - interrupt-controller
  - '#interrupt-cells'
  - gpio-controller
  - '#gpio-cells'
  - gpio-ranges

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/pinctrl/mt6833-pinfunc.h>

    pio: pinctrl@10005000 {
        compatible = "mediatek,mt6833-pinctrl";
        reg = <0x10005000 0x1000>,
              <0x11c30000 0x1000>,
              <0x11d10000 0x1000>,
              <0x11d40000 0x1000>,
              <0x11e20000 0x1000>,
              <0x11e60000 0x1000>,
              <0x11ea0000 0x1000>,
              <0x1000b000 0x1000>;
        reg-names = "base", "rb", "bm", "br", "lm", "bl", "rt", "eint";
        gpio-controller;
        #gpio-cells = <2>;
        gpio-ranges = <&pio 0 0 210>;
        interrupt-controller;
        interrupts = <GIC_SPI 212 IRQ_TYPE_LEVEL_HIGH 0>;
        #interrupt-cells = <2>;

        i2c0-pins {
            pins-bus {
                pinmux = <PINMUX_GPIO97__FUNC_SCL0>,
                         <PINMUX_GPIO98__FUNC_SDA0>;
                bias-pull-up;
                drive-strength = <6>;
            };
        };
    };
