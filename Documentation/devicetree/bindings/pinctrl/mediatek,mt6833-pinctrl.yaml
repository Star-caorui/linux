%YAML 1.2
---
$id: http://devicetree.org/schemas/pinctrl/mediatek,mt6833-pinctrl.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MediaTek MT6833 Pin Controller

maintainers:
  - Rui Cao <i@udp0.com>

description:
  The MediaTek's MT6833 Pin controller is used to control SoC pins.

properties:
  compatible:
    const: mediatek,mt6833-pinctrl

  reg:
    items:
      - description: gpio base
      - description: rb group IO
      - description: bm group IO
      - description: br group IO
      - description: lm group IO
      - description: bl group IO
      - description: rt group IO
      - description: eint controller base

  reg-names:
    items:
      - const: base
      - const: rb
      - const: bm
      - const: br
      - const: lm
      - const: bl
      - const: rt
      - const: eint

  interrupts:
    maxItems: 1

  interrupt-controller: true

  '#interrupt-cells':
    const: 2

  gpio-controller: true

  '#gpio-cells':
    const: 2

  gpio-ranges:
    maxItems: 1

  gpio-line-names: true

# PIN CONFIGURATION NODES
patternProperties:
  '-pins$':
    type: object
    additionalProperties: false

    patternProperties:
      '^pins':
        type: object
        allOf:
          - $ref: /schemas/pinctrl/pincfg-node.yaml
          - $ref: /schemas/pinctrl/pinmux-node.yaml
        additionalProperties: false
        description:
          A pinctrl node should contain at least one subnodes representing the
          pinctrl groups available on the machine. Each subnode will list the
          pins it needs, and how they should be configured, with regard to muxer
          configuration, pullups, drive strength, input enable/disable and input
          schmitt.

        properties:
          pinmux:
            description:
              Integer array, represents gpio pin number and mux setting.
              Supported pin number and mux varies for different SoCs, and are
              defined as macros in arch/arm64/boot/dts/mediatek/mt6833-pinfunc.h
              for this SoC.

          drive-strength:
            enum: [2, 4, 6, 8, 10, 12, 14, 16]

          drive-strength-microamp:
            enum: [125, 250, 500, 1000]

          bias-pull-down:
            oneOf:
              - type: boolean
                description: normal pull down.
              - enum: [100, 101, 102, 103]
                description: PUPD/R1/R0 pull down type. See MTK_PUPD_SET_R1R0_
                  defines in dt-bindings/pinctrl/mt65xx.h.

          bias-pull-up:
            oneOf:
              - type: boolean
                description: normal pull up.
              - enum: [100, 101, 102, 103]
                description: PUPD/R1/R0 pull up type. See MTK_PUPD_SET_R1R0_
                  defines in dt-bindings/pinctrl/mt65xx.h.

          bias-disable: true

          output-high: true

          output-low: true

          input-enable: true

          input-disable: true

          input-schmitt-enable: true

          input-schmitt-disable: true

        required:
          - pinmux

required:
  - compatible
  - reg
  - interrupts
  - interrupt-controller
  - '#interrupt-cells'
  - gpio-controller
  - '#gpio-cells'
  - gpio-ranges

additionalProperties: false

examples:
  - |
    #include <dt-bindings/pinctrl/mt65xx.h>
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #define PINMUX_GPIO97__FUNC_SCL0 (MTK_PIN_NO(97) | 1)
    #define PINMUX_GPIO98__FUNC_SDA0 (MTK_PIN_NO(98) | 1)

    pio: pinctrl@10005000 {
        compatible = "mediatek,mt6833-pinctrl";
        reg = <0x10005000 0x1000>,
              <0x11c30000 0x1000>,
              <0x11d10000 0x1000>,
              <0x11d40000 0x1000>,
              <0x11e20000 0x1000>,
              <0x11e60000 0x1000>,
              <0x11ea0000 0x1000>,
              <0x1000b000 0x1000>;
        reg-names = "base", "rb", "bm", "br", "lm", "bl", "rt", "eint";
        gpio-controller;
        #gpio-cells = <2>;
        gpio-ranges = <&pio 0 0 201>;
        interrupt-controller;
        interrupts = <GIC_SPI 212 IRQ_TYPE_LEVEL_HIGH 0>;
        #interrupt-cells = <2>;

        i2c0-pins {
            pins {
                pinmux = <PINMUX_GPIO97__FUNC_SCL0>,
                         <PINMUX_GPIO98__FUNC_SDA0>;
                bias-pull-up;
                drive-strength-microamp = <1000>;
            };
        };
    };
