%YAML 1.2
---
$id: http://devicetree.org/schemas/phy/mediatek,mt6833-csi-rx.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MediaTek MT6833 MIPI CSI-2 receiver D-PHY

maintainers:
  - Rui Cao <i@udp0.com>

description:
  Each CSI port pair of the MT6833 has an analog receiver half for each of its
  A and B ports and a D-PHY lane controller they share. The pair is used as
  one port with four data lanes over both halves, or as two independent ports
  of up to two data lanes each. The PHYs feed the SENINF CSI-2 receivers.

properties:
  compatible:
    const: mediatek,mt6833-csi-rx

  reg:
    maxItems: 1

  nvmem-cells:
    items:
      - description: Termination impedance calibration word.

  nvmem-cell-names:
    items:
      - const: calibration

  '#phy-cells':
    const: 1
    description:
      0 for the whole pair (up to 4 data lanes), 1 for the A port, 2 for the
      B port (up to 2 data lanes each).

required:
  - compatible
  - reg
  - '#phy-cells'

additionalProperties: false

examples:
  - |
    soc {
        #address-cells = <2>;
        #size-cells = <2>;

        phy@11c80000 {
            compatible = "mediatek,mt6833-csi-rx";
            reg = <0 0x11c80000 0 0x4000>;
            nvmem-cells = <&csi0_rx_calib>;
            nvmem-cell-names = "calibration";
            #phy-cells = <1>;
        };
    };
