%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/mediatek,mt6833-clock.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MediaTek Functional Clock Controllers for MT6833

maintainers:
  - Rui Cao <i@udp0.com>

description:
  The functional clock controllers gate the clocks of the IP blocks in their
  subsystem. The imp_iic_wrap blocks gate the I2C controllers' clocks, mfgcfg
  the GPU's. mfgcfg sits in a GPU power domain and needs it powered on to be
  accessed. The clock IDs are defined in
  include/dt-bindings/clock/mediatek,mt6833-clk.h.

properties:
  compatible:
    enum:
      - mediatek,mt6833-imp-iic-wrap-c
      - mediatek,mt6833-imp-iic-wrap-e
      - mediatek,mt6833-imp-iic-wrap-n
      - mediatek,mt6833-imp-iic-wrap-s
      - mediatek,mt6833-imp-iic-wrap-w
      - mediatek,mt6833-imp-iic-wrap-ws
      - mediatek,mt6833-mfgcfg

  reg:
    maxItems: 1

  power-domains:
    maxItems: 1

  '#clock-cells':
    const: 1

required:
  - compatible
  - reg
  - '#clock-cells'

allOf:
  - if:
      properties:
        compatible:
          contains:
            const: mediatek,mt6833-mfgcfg
    then:
      required:
        - power-domains
    else:
      properties:
        power-domains: false

additionalProperties: false

examples:
  - |
    clock-controller@11007000 {
        compatible = "mediatek,mt6833-imp-iic-wrap-c";
        reg = <0x11007000 0x1000>;
        #clock-cells = <1>;
    };
