%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/mediatek,mt6833-clock.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MediaTek Functional Clock Controllers for MT6833

maintainers:
  - Betterr <51264180+Star-caorui@users.noreply.github.com>

description:
  The MediaTek functional clock controllers gate the clocks of the MT6833
  subsystems they sit in (I2C, GPU, camera, imaging, multimedia data path and
  video codecs). The clock IDs are in
  include/dt-bindings/clock/mediatek,mt6833-clk.h.

properties:
  compatible:
    enum:
      - mediatek,mt6833-camsys
      - mediatek,mt6833-camsys-rawa
      - mediatek,mt6833-camsys-rawb
      - mediatek,mt6833-imgsys1
      - mediatek,mt6833-imgsys2
      - mediatek,mt6833-imp-iic-wrap-c
      - mediatek,mt6833-imp-iic-wrap-e
      - mediatek,mt6833-imp-iic-wrap-n
      - mediatek,mt6833-imp-iic-wrap-s
      - mediatek,mt6833-imp-iic-wrap-w
      - mediatek,mt6833-imp-iic-wrap-ws
      - mediatek,mt6833-ipesys
      - mediatek,mt6833-mdpsys
      - mediatek,mt6833-mfgcfg
      - mediatek,mt6833-vdecsys
      - mediatek,mt6833-vencsys

  reg:
    maxItems: 1

  power-domains:
    maxItems: 1

  '#clock-cells':
    const: 1

required:
  - compatible
  - reg
  - '#clock-cells'

allOf:
  - if:
      properties:
        compatible:
          contains:
            const: mediatek,mt6833-mfgcfg
    then:
      required:
        - power-domains
    else:
      properties:
        power-domains: false

additionalProperties: false

examples:
  - |
    #include <dt-bindings/power/mediatek,mt6833-power.h>

    soc {
        #address-cells = <2>;
        #size-cells = <2>;

        clock-controller@13fbf000 {
            compatible = "mediatek,mt6833-mfgcfg";
            reg = <0 0x13fbf000 0 0x1000>;
            power-domains = <&spm MT6833_POWER_DOMAIN_MFG1>;
            #clock-cells = <1>;
        };

        clock-controller@1a000000 {
            compatible = "mediatek,mt6833-camsys";
            reg = <0 0x1a000000 0 0x1000>;
            #clock-cells = <1>;
        };
    };
