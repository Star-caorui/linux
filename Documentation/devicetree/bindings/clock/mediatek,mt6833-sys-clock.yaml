%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/mediatek,mt6833-sys-clock.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MediaTek System Clock Controllers for MT6833

maintainers:
  - Rui Cao <i@udp0.com>

description:
  The apmixedsys block provides the PLLs, which run from the SoC's 26 MHz
  crystal. The topckgen block provides the dividers and muxes that feed the
  other IP blocks. The infracfg_ao block gates the clocks of the
  infrastructure and peripheral IP blocks and provides their software resets.
  The mcusys block selects the clock sources of the CPU clusters and the CCI.
  The clock IDs are defined in include/dt-bindings/clock/mediatek,mt6833-clk.h
  and the reset IDs in include/dt-bindings/reset/mediatek,mt6833-resets.h.

properties:
  compatible:
    items:
      - enum:
          - mediatek,mt6833-apmixedsys
          - mediatek,mt6833-infracfg-ao
          - mediatek,mt6833-mcusys
          - mediatek,mt6833-topckgen
      - const: syscon

  reg:
    maxItems: 1

  '#clock-cells':
    const: 1

  '#reset-cells':
    const: 1

required:
  - compatible
  - reg
  - '#clock-cells'

allOf:
  - if:
      properties:
        compatible:
          contains:
            const: mediatek,mt6833-infracfg-ao
    then:
      required:
        - '#reset-cells'
    else:
      properties:
        '#reset-cells': false

additionalProperties: false

examples:
  - |
    clock-controller@10000000 {
        compatible = "mediatek,mt6833-topckgen", "syscon";
        reg = <0x10000000 0x1000>;
        #clock-cells = <1>;
    };

  - |
    clock-controller@10001000 {
        compatible = "mediatek,mt6833-infracfg-ao", "syscon";
        reg = <0x10001000 0x1000>;
        #clock-cells = <1>;
        #reset-cells = <1>;
    };
