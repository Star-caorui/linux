%YAML 1.2
---
$id: http://devicetree.org/schemas/media/i2c/smartsens,sc202cs.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: SmartSens SC202CS 2 Mpixel monochrome MIPI CSI-2 sensor

maintainers:
  - Rui Cao <i@udp0.com>

description:
  The SC202CS is a 1600x1200 monochrome image sensor with a single-lane MIPI
  CSI-2 D-PHY data interface and a CCI (I2C compatible) control bus. Its
  digital core supply can be generated inside the sensor.

allOf:
  - $ref: /schemas/media/video-interface-devices.yaml#

properties:
  compatible:
    const: smartsens,sc202cs

  reg:
    maxItems: 1

  clocks:
    description: MCLK, 24 MHz.
    maxItems: 1

  dovdd-supply:
    description: Digital I/O supply, 1.8 V.

  avdd-supply:
    description: Analog supply, 2.8 V.

  dvdd-supply:
    description: Digital core supply, 1.2 V, if not generated inside the sensor.

  reset-gpios:
    description: The XSHUTDN pin, active low.
    maxItems: 1

  port:
    $ref: /schemas/graph.yaml#/$defs/port-base
    additionalProperties: false

    properties:
      endpoint:
        $ref: /schemas/media/video-interfaces.yaml#
        unevaluatedProperties: false

        properties:
          data-lanes:
            items:
              - const: 1

          link-frequencies: true

        required:
          - data-lanes
          - link-frequencies

    required:
      - endpoint

required:
  - compatible
  - reg
  - clocks
  - dovdd-supply
  - avdd-supply
  - port

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        camera-sensor@36 {
            compatible = "smartsens,sc202cs";
            reg = <0x36>;
            clocks = <&camera_mclk>;
            reset-gpios = <&pio 60 GPIO_ACTIVE_LOW>;
            dovdd-supply = <&vcamio>;
            avdd-supply = <&cam_avdd>;

            port {
                endpoint {
                    data-lanes = <1>;
                    link-frequencies = /bits/ 64 <360000000>;
                    remote-endpoint = <&csi_in>;
                };
            };
        };
    };
...
