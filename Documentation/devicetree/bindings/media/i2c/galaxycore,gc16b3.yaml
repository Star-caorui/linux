%YAML 1.2
---
$id: http://devicetree.org/schemas/media/i2c/galaxycore,gc16b3.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: GalaxyCore GC16B3 16 Mpixel MIPI CSI-2 sensor

maintainers:
  - Rui Cao <i@udp0.com>

description:
  The GC16B3 is a raw Bayer image sensor with a four-lane MIPI CSI-2 D-PHY
  data interface and a CCI (I2C compatible) control bus.

allOf:
  - $ref: /schemas/media/video-interface-devices.yaml#

properties:
  compatible:
    const: galaxycore,gc16b3

  reg:
    maxItems: 1

  clocks:
    description: MCLK, 24 MHz.
    maxItems: 1

  dovdd-supply:
    description: Digital I/O supply, 1.8 V.

  dvdd-supply:
    description: Digital core supply, 1.2 V.

  avdd-supply:
    description: Analog supply, 2.8 V.

  reset-gpios:
    description: The RESETB pin, active low.
    maxItems: 1

  port:
    $ref: /schemas/graph.yaml#/$defs/port-base
    additionalProperties: false

    properties:
      endpoint:
        $ref: /schemas/media/video-interfaces.yaml#
        unevaluatedProperties: false

        properties:
          data-lanes:
            items:
              - const: 1
              - const: 2
              - const: 3
              - const: 4

          link-frequencies: true

        required:
          - data-lanes
          - link-frequencies

    required:
      - endpoint

required:
  - compatible
  - reg
  - clocks
  - dovdd-supply
  - dvdd-supply
  - avdd-supply
  - port

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        camera-sensor@10 {
            compatible = "galaxycore,gc16b3";
            reg = <0x10>;
            clocks = <&camera_mclk>;
            reset-gpios = <&pio 54 GPIO_ACTIVE_LOW>;
            dovdd-supply = <&vcamio>;
            dvdd-supply = <&cam_dvdd>;
            avdd-supply = <&cam_avdd>;
            orientation = <0>;
            rotation = <270>;

            port {
                endpoint {
                    data-lanes = <1 2 3 4>;
                    link-frequencies = /bits/ 64 <181200000>;
                    remote-endpoint = <&csi_in>;
                };
            };
        };
    };
...
