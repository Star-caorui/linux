%YAML 1.2
---
$id: http://devicetree.org/schemas/media/mediatek,mt6833-camsv.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MediaTek MT6833 camera DMA engine (camsv)

maintainers:
  - Rui Cao <i@udp0.com>

description:
  A camsv instance takes one SENINF output, crops it in its timing generator
  and writes it to memory through its IMGO DMA, behind the M4U.

properties:
  compatible:
    const: mediatek,mt6833-camsv

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    items:
      - description: CAM clock gate in camsys
      - description: CAMTG clock gate in camsys
      - description: Clock gate of the camsv pair in camsys

  clock-names:
    items:
      - const: cam
      - const: camtg
      - const: camsv

  power-domains:
    maxItems: 1

  iommus:
    maxItems: 1

  port:
    $ref: /schemas/graph.yaml#/properties/port
    description: Input from a SENINF output.

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - clock-names
  - power-domains
  - iommus
  - port

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/mediatek,mt6833-clk.h>
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/power/mediatek,mt6833-power.h>

    soc {
        #address-cells = <2>;
        #size-cells = <2>;

        camsv@1a092000 {
            compatible = "mediatek,mt6833-camsv";
            reg = <0 0x1a092000 0 0x1000>;
            interrupts = <GIC_SPI 327 IRQ_TYPE_LEVEL_HIGH>;
            clocks = <&camsys CLK_CAM_M_CAM>,
                     <&camsys CLK_CAM_M_CAMTG>,
                     <&camsys CLK_CAM_M_CAMSV1>;
            clock-names = "cam", "camtg", "camsv";
            iommus = <&iommu 6>;
            power-domains = <&spm MT6833_POWER_DOMAIN_CAM>;

            port {
                endpoint {
                    remote-endpoint = <&seninf_camsv2>;
                };
            };
        };
    };
