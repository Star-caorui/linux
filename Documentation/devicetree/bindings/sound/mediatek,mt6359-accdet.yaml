%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/mediatek,mt6359-accdet.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MediaTek MT6359 accessory detection

maintainers:
  - Rui Cao <i@udp0.com>

description:
  The accessory detection (accdet) block of the MT6359 PMIC detects
  headset plug-in and removal, the headset microphone and the headset
  buttons. It is a child node of the PMIC and must be named accdet.

properties:
  compatible:
    const: mediatek,mt6359-accdet

  io-channels:
    maxItems: 1
    description:
      The accdet channel of the PMIC AUXADC, which measures the voltage the
      headset buttons pull the microphone line to.

  io-channel-names:
    const: pmic_accdet

  mediatek,mic-vol:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: Microphone bias voltage setting (register value).
    default: 8

  mediatek,plugout-debounce:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: Plug-out debounce setting (register value).
    default: 1

  mediatek,mic-mode:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: Microphone mode, 1 ACC, 2 DCC, 6 DCC with internal bias.
    enum: [1, 2, 6]
    default: 2

  mediatek,pwm-deb-setting:
    $ref: /schemas/types.yaml#/definitions/uint32-array
    description:
      PWM width and threshold, fall and rise delay, the debounce times of
      the detection states and the EINT PWM settings, as register values.
    minItems: 15
    maxItems: 15

  mediatek,eint-level-pol:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: EINT trigger level.
    default: 8

  mediatek,eint-use-ap:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: 0 to use the PMIC EINT, 1 to use an AP GPIO EINT.
    enum: [0, 1]
    default: 0

  mediatek,eint-detect-mode:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: EINT detection mode (register value).
    default: 4

  mediatek,eint-num:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: PMIC EINT used, 0 EINT0, 1 EINT1, 2 both.
    enum: [0, 1, 2]
    default: 0

  mediatek,eint-trig-mode:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: 0 to trigger the EINT from the GPIO, 1 from the inverter.
    enum: [0, 1]
    default: 0

  mediatek,eint-use-ext-res:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: 1 if the EINT uses an external pull resistor.
    enum: [0, 1]
    default: 0

  mediatek,eint-comp-vth:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: EINT comparator threshold (register value).
    default: 0

  mediatek,key-mode:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: 0 three keys, 1 four keys, 2 three keys (CDD thresholds).
    enum: [0, 1, 2]
    default: 0

  mediatek,three-key-thr:
    $ref: /schemas/types.yaml#/definitions/uint32-array
    description: Button voltage thresholds in mV for three keys.
    minItems: 4
    maxItems: 4

  mediatek,four-key-thr:
    $ref: /schemas/types.yaml#/definitions/uint32-array
    description: Button voltage thresholds in mV for four keys.
    minItems: 5
    maxItems: 5

  mediatek,tri-key-cdd-thr:
    $ref: /schemas/types.yaml#/definitions/uint32-array
    description: Button voltage thresholds in mV for three keys, CDD.
    minItems: 4
    maxItems: 4

required:
  - compatible

additionalProperties: false

examples:
  - |
    accdet {
        compatible = "mediatek,mt6359-accdet";
        mediatek,mic-mode = <2>;
        mediatek,eint-trig-mode = <1>;
        mediatek,three-key-thr = <0 80 220 400>;
    };
...
