%YAML 1.2
---
$id: http://devicetree.org/schemas/regulator/willsemi,wl2866d.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Will Semiconductor WL2866D camera PMIC

maintainers:
  - Rui Cao <i@udp0.com>

description:
  The WL2866D is an I2C controlled power management IC for camera modules
  with four low-dropout regulators. DVDD1 and DVDD2 (0.6 V to 1.8 V) are fed
  from VIN1, AVDD1 and AVDD2 (1.2 V to 4.3 V) from VIN2, which also biases the
  chip.

properties:
  compatible:
    const: willsemi,wl2866d

  reg:
    maxItems: 1

  vin1-supply:
    description: Input of the DVDD regulators.

  vin2-supply:
    description: Input of the AVDD regulators and the bias supply.

  regulators:
    type: object
    additionalProperties: false

    patternProperties:
      "^[ad]vdd[12]$":
        type: object
        $ref: regulator.yaml#
        unevaluatedProperties: false

required:
  - compatible
  - reg
  - regulators

additionalProperties: false

examples:
  - |
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        pmic@28 {
            compatible = "willsemi,wl2866d";
            reg = <0x28>;

            regulators {
                dvdd2 {
                    regulator-name = "cam_dvdd2";
                    regulator-min-microvolt = <1200000>;
                    regulator-max-microvolt = <1200000>;
                    regulator-active-discharge = <1>;
                };

                avdd2 {
                    regulator-name = "cam_avdd2";
                    regulator-min-microvolt = <2800000>;
                    regulator-max-microvolt = <2800000>;
                    regulator-active-discharge = <1>;
                };
            };
        };
    };
...
